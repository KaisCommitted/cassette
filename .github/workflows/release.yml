name: Release

# Push a tag like v1.2.3 to build the Windows installer and publish it as a
# GitHub Release. The app checks this same release feed on launch, so tagging
# is the whole publish step — see src/main/updater.ts.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # electron-builder uploads the installer, its blockmap and latest.yml as
  # near-simultaneous requests. With no release to attach to, each upload
  # independently tries to create one — the log shows "creating GitHub release"
  # twice — and the job can finish before the largest upload does, leaving a
  # draft holding only the small files. Pre-creating an empty draft means every
  # upload finds it already there and simply attaches.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --draft \
                 --title "${{ github.ref_name }}" \
                 --notes ""

  build:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # mpv is not committed: it is a ~120 MB binary and belongs to upstream.
      # The installer bundles it so the app has no external dependency at
      # runtime, which means fetching it here rather than at install time.
      - name: Fetch mpv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/mpv | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          # The player build, not mpv-dev (headers and import libs, no mpv.exe).
          $asset = $release.assets |
            Where-Object { $_.name -like "mpv-x86_64-*.7z" -and $_.name -notlike "*dev*" -and $_.name -notlike "*v3*" } |
            Select-Object -First 1
          if (-not $asset) { throw "no mpv build found in the latest release" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z
          # Windows ships bsdtar, which reads 7z — no extra tool to install.
          tar -xf mpv.7z -C resources/mpv
          if (-not (Test-Path resources/mpv/mpv.exe)) { throw "mpv.exe missing after extract" }
          # Trim what the app never launches, to keep the installer smaller.
          Remove-Item resources/mpv/installer -Recurse -ErrorAction SilentlyContinue
          Remove-Item resources/mpv/doc -Recurse -ErrorAction SilentlyContinue
          Remove-Item resources/mpv/*.bat -ErrorAction SilentlyContinue
          Remove-Item resources/mpv/mpv.com -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The tag is the source of truth for the version, so the updater compares
      # against what was actually released rather than whatever is committed.
      - name: Set version from tag
        shell: pwsh
        run: npm pkg set version=$("${{ github.ref_name }}" -replace '^v', '')

      # The keys are compiled in here, so an installed copy works with no setup.
      # They are secrets rather than source because this repository is public:
      # a key committed to it would be found and revoked, breaking every
      # installed copy. A build without them asks for keys in settings instead.
      - name: Build renderer and main
        env:
          CASSETTE_TMDB_KEY: ${{ secrets.CASSETTE_TMDB_KEY }}
          CASSETTE_SUBDL_KEY: ${{ secrets.CASSETTE_SUBDL_KEY }}
          CASSETTE_OPENSUBTITLES_KEY: ${{ secrets.CASSETTE_OPENSUBTITLES_KEY }}
        run: npm run build

      # A release that shipped without its keys would look fine and quietly
      # have no artwork and no subtitle search, so it is checked rather than
      # assumed.
      - name: Verify the keys were compiled in
        shell: pwsh
        run: |
          $bundle = Get-Content out/main/index.js -Raw
          foreach ($marker in @('__BUNDLED_TMDB_KEY__', '__BUNDLED_SUBDL_KEY__')) {
            if ($bundle.Contains($marker)) { throw "$marker was never substituted" }
          }
          if (-not $bundle.Contains('subdl_')) { throw "the SubDL key is missing from the build" }
          Write-Host "Keys are present in the build."

      - name: Build and publish the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # electron-builder reports success once it has handed the uploads off, so
      # confirm the installer and the update manifest actually landed rather
      # than trusting the exit code.
      - name: Verify the release has everything the updater needs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $names = gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
          Write-Host "Assets: $names"
          foreach ($required in @('Cassette-Setup.exe', 'latest.yml')) {
            if ($names -notcontains $required) { throw "$required is missing from the release" }
          }

  # electron-builder leaves the release in draft; publishing it is what makes
  # it show up as "latest", which is what the updater actually reads.
  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
